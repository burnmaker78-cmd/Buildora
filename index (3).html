<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="logo" href="index.html">Buildora</a><nav id="nav"></nav></header>
<section class="hero"><h1>Pick a game. Jump in.</h1><p>Games made by us. Click a card to play it on its own page.</p></section>
<div class="grass"></div>
<main><div class="grid" id="grid"></div></main>
<div id="toast" role="status"></div>
<script type="module">
import { initHeader } from "./app.js";
initHeader();

// EDIT THIS LIST to add games. url = the website where that game lives ("" = coming soon).
const GAMES = [
  { name: "Steal a Town", desc: "Build a town, earn money, and raid your friends’ towns.", emoji: "🏘️", bg: "#bde8c8", url: "" },
  { name: "Game 2", desc: "Your next idea goes here.", emoji: "🎲", bg: "#ffe9a6", url: "" },
  { name: "Game 3", desc: "Your next idea goes here.", emoji: "🚀", bg: "#c6e3ff", url: "" }
];
const grid = document.getElementById("grid"), toast = document.getElementById("toast");
let t;
const say = m => { toast.textContent = m; toast.classList.add("show"); clearTimeout(t); t = setTimeout(() => toast.classList.remove("show"), 2500); };
GAMES.forEach(g => {
  const ready = g.url && g.url.trim() !== "";
  const a = document.createElement("a");
  a.className = "card" + (ready ? "" : " soon");
  a.href = ready ? g.url : "#";
  a.innerHTML = '<div class="thumb" style="background:' + g.bg + '">' + g.emoji + '</div><div class="body"><h3></h3><p></p><span class="tag">' + (ready ? "Play now" : "Coming soon") + '</span></div>';
  a.querySelector("h3").textContent = g.name;
  a.querySelector("p").textContent = g.desc;
  if (!ready) a.addEventListener("click", e => { e.preventDefault(); say(g.name + " isn’t ready yet."); });
  grid.appendChild(a);
});
</script>
</body>
</html>
