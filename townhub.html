<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buildora</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<style>
:root{
  --sky:#3da5ff; --grass:#3fbf6b; --sun:#ffd23f; --ink:#1b2a41; --paper:#fff9ec; --card:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#14213a; --card:#1d2f50; --ink:#f5f1e4; }
}
:root[data-theme="dark"]{ --paper:#14213a; --card:#1d2f50; --ink:#f5f1e4; }
*{box-sizing:border-box}
body{margin:0;font-family:"Fredoka",system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5}
header{background:var(--sky);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:6px solid var(--ink)}
.logo{font-size:2rem;font-weight:700;color:#fff;text-shadow:3px 3px 0 var(--ink);letter-spacing:.5px}
nav a{color:#fff;font-weight:600;text-decoration:none;margin-left:18px}
nav a:focus-visible,.card:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hero{padding:48px 24px 24px;max-width:900px;margin:0 auto}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;margin:0 0 12px}
.hero p{font-size:1.2rem;max-width:52ch;margin:0}
.grass{height:14px;background:var(--grass);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink);margin:28px 0}
main{max-width:1000px;margin:0 auto;padding:0 24px 56px}
h2{font-size:1.6rem;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:4px solid var(--ink);border-radius:18px;overflow:hidden;box-shadow:6px 6px 0 var(--ink);transition:transform .12s, box-shadow .12s;cursor:pointer}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--ink)}
.thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;border-bottom:4px solid var(--ink)}
.body{padding:14px 16px 16px}
.body h3{margin:0 0 4px;font-size:1.25rem}
.body p{margin:0 0 10px;font-size:.95rem;opacity:.85}
.tag{display:inline-block;font-size:.85rem;font-weight:600;background:var(--sun);color:#1b2a41;border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
.soon .tag{background:#d9d9d9}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .2s;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
footer{text-align:center;padding:24px;opacity:.7;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.card,#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo">Buildora</div>
  <nav><a href="#games">Games</a></nav>
</header>

<section class="hero">
  <h1>Pick a game. Jump in.</h1>
  <p>Games made by us. Click a card to play it on its own page.</p>
</section>
<div class="grass"></div>

<main id="games">
  <h2>All games</h2>
  <div class="grid" id="grid"></div>
</main>

<footer>Made by two friends. More games coming.</footer>
<div id="toast" role="status"></div>

<script>
// EDIT THIS LIST to add games.
// url = the website where that game lives. Leave it "" until the game is ready.
const GAMES = [
  { name: "Steal a Town", desc: "Build a town, earn money, and raid your friends’ towns.", emoji: "🏘️", bg: "#bde8c8", url: "" },
  { name: "Game 2", desc: "Your next idea goes here.", emoji: "🎲", bg: "#ffe9a6", url: "" },
  { name: "Game 3", desc: "Your next idea goes here.", emoji: "🚀", bg: "#c6e3ff", url: "" }
];

const grid = document.getElementById("grid");
const toast = document.getElementById("toast");
let toastTimer;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

GAMES.forEach(g => {
  const ready = g.url && g.url.trim() !== "";
  const a = document.createElement("a");
  a.className = "card" + (ready ? "" : " soon");
  a.tabIndex = 0;
  if (ready) { a.href = g.url; }
  a.innerHTML =
    '<div class="thumb" style="background:' + g.bg + '">' + g.emoji + '</div>' +
    '<div class="body"><h3></h3><p></p><span class="tag">' + (ready ? "Play now" : "Coming soon") + '</span></div>';
  a.querySelector("h3").textContent = g.name;
  a.querySelector("p").textContent = g.desc;
  if (!ready) {
    a.addEventListener("click", e => { e.preventDefault(); showToast(g.name + " isn’t ready yet."); });
    a.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); showToast(g.name + " isn’t ready yet."); } });
  }
  grid.appendChild(a);
});
</script>
</body>
</html>
